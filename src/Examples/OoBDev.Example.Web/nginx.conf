server {
  listen 80;
  root /usr/share/nginx/html;

  # API, documents and the generated references are served by the API host.
  location ~ ^/(api|Document|Search|openapi|scalar|asyncapi)(/|$) {
    proxy_pass http://example-api:8080;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    try_files $uri /index.html;
  }
}
