name: Scheduled Daily Release

# Automatically release and publish main branch builds at end of day if there are changes since last release
on:
  schedule:
    # Run daily at 5 PM UTC
    - cron: '0 17 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

env:
  MSBUILDTERMINALLOGGER: off

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
      last-tag: ${{ steps.check.outputs.last-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Check for changes on main since last release
        id: check
        run: |
          # Get the most recent build tag (v prefix) on main
          # Skip release tags (release-v prefix) and deployment tags (nuget- prefix)
          LAST_TAG=$(git tag -l 'v*' --sort=-version:refname --merged main 2>/dev/null | head -1 || echo "none")
          echo "last-tag=$LAST_TAG" >> $GITHUB_OUTPUT

          if [ "$LAST_TAG" = "none" ]; then
            # No tags yet, treat as changes exist
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "✅ No previous releases - changes detected"
          else
            # Check if there are commits since the last tag on main
            COMMITS_SINCE_TAG=$(git rev-list --count $LAST_TAG..main 2>/dev/null || echo "0")

            if [ "$COMMITS_SINCE_TAG" -gt 0 ]; then
              echo "has-changes=true" >> $GITHUB_OUTPUT
              echo "✅ Found $COMMITS_SINCE_TAG new commits since $LAST_TAG - changes detected"
            else
              echo "has-changes=false" >> $GITHUB_OUTPUT
              echo "⏭️ No new commits since $LAST_TAG - skipping release"
            fi
          fi

  find-artifact:
    needs: check-changes
    if: needs.check-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.find-artifact.outputs.artifact-name }}

    steps:
      - name: Find Latest Package Artifact from Main
        id: find-artifact
        run: |
          # Get the latest successful build run number from main branch
          RUN_ID=$(gh run list --branch main --workflow dotnet.yml --status success --limit 1 --json number -q '.[0].number')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "❌ No successful build runs found for main branch"
            exit 1
          fi

          echo "Found build run: $RUN_ID"

          # Query artifacts for that run and get the first packages artifact
          ARTIFACT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("packages-")) | .name' | head -1)

          if [ -z "$ARTIFACT" ] || [ "$ARTIFACT" = "null" ]; then
            echo "❌ No package artifacts found in run $RUN_ID"
            exit 1
          fi

          echo "artifact-name=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "✅ Using artifact: $ARTIFACT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: find-artifact
    uses: ./.github/workflows/deploy-release.yml
    with:
      artifact-name: ${{ needs.find-artifact.outputs.artifact-name }}
      publish-to-nuget: 'true'
    secrets: inherit
