name: Manual Release

# Manual trigger for on-demand release creation
on:
  workflow_dispatch:
    inputs:
      artifact-name:
        description: 'Package artifact name (e.g., packages-1.2.3 or leave empty to auto-detect)'
        required: false
        type: string
      publish-to-nuget:
        description: 'Publish to NuGet.org'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  MSBUILDTERMINALLOGGER: off

jobs:
  find-artifact:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.result.outputs.artifact-name }}

    steps:
      - name: Find or use specified artifact
        id: result
        run: |
          ARTIFACT="${{ inputs.artifact-name }}"

          if [ -z "$ARTIFACT" ]; then
            # Auto-detect latest successful build artifact
            RUN_ID=$(gh run list --workflow dotnet.yml --status success --limit 1 --json number -q '.[0].number')

            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "❌ No successful build runs found"
              exit 1
            fi

            echo "Found build run: $RUN_ID"

            # Query artifacts for that run and get the first packages artifact
            ARTIFACT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("packages-")) | .name' | head -1)

            if [ -z "$ARTIFACT" ] || [ "$ARTIFACT" = "null" ]; then
              echo "❌ No package artifacts found in run $RUN_ID"
              exit 1
            fi
          fi

          echo "artifact-name=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "✅ Using artifact: $ARTIFACT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: find-artifact
    uses: ./.github/workflows/deploy-release.yml
    with:
      artifact-name: ${{ needs.find-artifact.outputs.artifact-name }}
      publish-to-nuget: ${{ inputs.publish-to-nuget || 'false' }}
    secrets: inherit
