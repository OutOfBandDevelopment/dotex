name: Release

# Manual trigger for on-demand release creation and publishing
on:
  workflow_dispatch:
    inputs:
      release-action:
        description: 'Release Action'
        required: true
        default: 'create-release'
        type: choice
        options:
          - create-release
          - create-and-publish-release
      packages-artifact:
        description: 'Package artifact name (from build run)'
        required: false
        type: string

env:
  MSBUILDTERMINALLOGGER: off

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.parse-artifact.outputs.version }}
      release-url: ${{ steps.create-release.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      # If artifact name not specified, find the latest one
      - name: Find Latest Package Artifact
        id: find-artifact
        if: ${{ !inputs.packages-artifact }}
        run: |
          # Get the latest successful build artifact
          ARTIFACT=$(gh run list --workflow dotnet.yml --status success --limit 1 --json artifacts -q '.[0].artifacts[0].name')
          echo "artifact-name=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "Using latest artifact: $ARTIFACT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Artifact Name
        id: artifact-name
        run: |
          NAME="${{ inputs.packages-artifact || steps.find-artifact.outputs.artifact-name }}"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      # Download packages from build
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ./packages

      # Parse version from artifact name
      - name: Parse Version from Artifact
        id: parse-artifact
        run: |
          # Extract version from artifact name format: packages-X.Y.Z-...
          ARTIFACT_NAME="${{ steps.artifact-name.outputs.name }}"
          VERSION="${ARTIFACT_NAME#packages-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      # Create GitHub Release
      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.parse-artifact.outputs.version }}
          name: Release ${{ steps.parse-artifact.outputs.version }}
          files: ./packages/*.nupkg
          draft: false
          prerelease: ${{ contains(steps.parse-artifact.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nuget:
    needs: release
    runs-on: ubuntu-latest
    # Require approval only when user selects "create-and-publish-release"
    environment:
      name: nuget-release
      url: ${{ needs.release.outputs.release-url }}
    # Only run if user selected "create-and-publish-release"
    if: github.event.inputs.release-action == 'create-and-publish-release'

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Download packages from build
      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.packages-artifact || format('packages-{0}', needs.release.outputs.release-tag) }}
          path: ./packages

      - name: Publish to NuGet
        run: |
          dotnet nuget push \
            "./packages/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Confirm Deployment
        run: |
          echo "✅ Release published to NuGet"
          echo "Release URL: ${{ needs.release.outputs.release-url }}"
          echo "Version: ${{ needs.release.outputs.release-tag }}"
