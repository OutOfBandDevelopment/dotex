# This workflow will build, test, and package a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build Pipeline
# https://docs.github.com/en/actions/learn-github-actions/contexts#vars-context
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#run-name
run-name: Build ${{ inputs.build-configuration || 'Release' }}/${{ inputs.build-platform || 'windows-latest' }} by @${{ github.actor }} (@${{ github.event_name }})

on:
  push:
    branches:
    - main
    - 'dev/*'
    paths:
    - 'src/**/*.cs'
    - 'src/**/*.csproj'
    - 'src/**/*.sln'
    - 'src/**/*.props'
    - 'src/**/*.targets'
    - 'src/.runsettings'
    - 'src/GitVersion.yml'
    - '.github/workflows/dotnet.yml'

  pull_request:
    branches:
    - main
    - 'dev/*'
    paths:
    - 'src/**/*.cs'
    - 'src/**/*.csproj'
    - 'src/**/*.sln'
    - 'src/**/*.props'
    - 'src/**/*.targets'
    - 'src/.runsettings'
    - 'src/GitVersion.yml'
    - '.github/workflows/dotnet.yml'

  # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpull_requestpull_request_targetbranchesbranches-ignore
  workflow_dispatch:
    inputs:
      build-configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      build-platform:
        description: 'Build Platform'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest

env:
  MSBUILDTERMINALLOGGER: off

jobs:
  build:
    runs-on: "${{ inputs.build-platform || 'windows-latest' }}"
    # Note: Defaults to 'windows-latest' to support .NET Framework (SQLCLR) projects
    # The workflow will skip .NET Framework builds on non-Windows runners

    steps:
      # https://github.com/actions/checkout
    - uses: actions/checkout@v6.0.2
      with:
        clean: true
        persist-credentials: true
        fetch-depth: 0
        lfs: true
        submodules: recursive

      # Pull LFS files from submodules (GitHub Actions doesn't do this automatically)
    - name: Checkout LFS files in submodules
      shell: bash
      run: |
        git submodule foreach --recursive 'git lfs fetch && git lfs checkout'

      # https://github.com/actions/setup-dotnet
    - name: Install .Net 10.0 SDK
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: 10.0.x

      # https://github.com/GitTools/actions/blob/main/docs/examples/github/gitversion/setup/usage-examples.md
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.2.0
      with:
        versionSpec: '6.0.x'

      # https://github.com/GitTools/actions/blob/main/docs/examples/github/gitversion/execute/usage-examples.md
    - name: Use GitVersion
      uses: gittools/actions/gitversion/execute@v4.2.0
      id:   gitversion
      with:
        configFilePath: GitVersion.yml
    
      # https://github.blog/changelog/2022-10-11-github-actions-deprecating-save-state-and-set-output-commands/
      # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
      # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions?tool=powershell
    - name: Set Version Variables
      id: calculate-version
      shell: pwsh
      working-directory: ./src
      run: |
        echo "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
        echo "RUNNER_TEMP=$env:RUNNER_TEMP"
                
        $buildConfiguration = "${{ inputs.build-configuration || 'Release' }}" 
        echo "BuildConfiguration=$buildConfiguration"
        echo "BuildConfiguration=$buildConfiguration" >> "$env:GITHUB_OUTPUT"
        echo "BuildConfiguration=$buildConfiguration" >> "$env:GITHUB_ENV"

        $fullSemVerLower = "${{ steps.gitversion.outputs.fullSemVer }}".ToLower() 
        if ($buildConfiguration -eq "Debug") {
            $fullSemVerLower = "${{ steps.gitversion.outputs.majorMinorPatch }}${{ steps.gitversion.outputs.preReleaseLabelWithDash }}-debug.${{ steps.gitversion.outputs.preReleaseNumber }}"
        }
        echo "FullSemVerLower=$fullSemVerLower"
        echo "FullSemVerLower=$fullSemVerLower" >> "$env:GITHUB_OUTPUT"
        echo "FullSemVerLower=$fullSemVerLower" >> "$env:GITHUB_ENV"
        
        $workspace = $env:GITHUB_WORKSPACE
        echo "BuildWorkspace=$workspace"
        echo "BuildWorkspace=$workspace" >> "$env:GITHUB_OUTPUT"
        echo "BuildWorkspace=$workspace" >> "$env:GITHUB_ENV"

        $testResultsPath = JOIN-PATH -Path $env:RUNNER_TEMP -ChildPath "TestResults"
        echo "TestResultsPath=$testResultsPath"
        echo "TestResultsPath=$testResultsPath" >> "$env:GITHUB_OUTPUT"
        echo "TestResultsPath=$testResultsPath" >> "$env:GITHUB_ENV"
        
        $packagesPath = JOIN-PATH -Path $env:RUNNER_TEMP -ChildPath "Packages"
        echo "PackagesPath=$packagesPath"
        echo "PackagesPath=$packagesPath" >> "$env:GITHUB_OUTPUT"
        echo "PackagesPath=$packagesPath" >> "$env:GITHUB_ENV"
        
        $runSettings = JOIN-PATH -Path $env:GITHUB_WORKSPACE -ChildPath ".runsettings"
        echo "RunSettings=$runSettings"
        echo "RunSettings=$runSettings" >> "$env:GITHUB_OUTPUT"
        echo "RunSettings=$runSettings" >> "$env:GITHUB_ENV"
  
    - name: Restore dependencies
      working-directory: ./src
      run: >
        dotnet restore
        --property:Version=${{ steps.calculate-version.outputs.FullSemVerLower }}
        --property:SolutionDir=${{ steps.calculate-version.outputs.BuildWorkspace }}/src/
        --property:GitVersion_AssemblySemFileVer=${{ steps.gitversion.outputs.assemblySemFileVer }}
        --property:GitVersion_InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
        --property:GitVersion_FullSemVer=${{ steps.gitversion.outputs.fullSemVer }}
        --property:GitVersion_Major=${{ steps.gitversion.outputs.major }}
        --property:GitVersion_Minor=${{ steps.gitversion.outputs.minor }}
        --property:GitVersion_Patch=${{ steps.gitversion.outputs.patch }}

    - name: Build
      working-directory: ./src
      run: >
        dotnet build
        --configuration ${{ steps.calculate-version.outputs.BuildConfiguration }}
        --property:Version=${{ steps.calculate-version.outputs.FullSemVerLower }}
        --property:SolutionDir=${{ steps.calculate-version.outputs.BuildWorkspace }}/src/
        --property:GitVersion_AssemblySemFileVer=${{ steps.gitversion.outputs.assemblySemFileVer }}
        --property:GitVersion_InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
        --property:GitVersion_FullSemVer=${{ steps.gitversion.outputs.fullSemVer }}
        --property:GitVersion_Major=${{ steps.gitversion.outputs.major }}
        --property:GitVersion_Minor=${{ steps.gitversion.outputs.minor }}
        --property:GitVersion_Patch=${{ steps.gitversion.outputs.patch }}
        --nologo
        --no-restore

    - name: Unit & Simulated Test
      working-directory: ./src
      run: >
        dotnet test
        --configuration ${{ steps.calculate-version.outputs.BuildConfiguration }}
        --property:Version=${{ steps.calculate-version.outputs.FullSemVerLower }}
        --property:SolutionDir=${{ steps.calculate-version.outputs.BuildWorkspace }}/src/
        --property:GitVersion_AssemblySemFileVer=${{ steps.gitversion.outputs.assemblySemFileVer }}
        --property:GitVersion_InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
        --property:GitVersion_FullSemVer=${{ steps.gitversion.outputs.fullSemVer }}
        --property:GitVersion_Major=${{ steps.gitversion.outputs.major }}
        --property:GitVersion_Minor=${{ steps.gitversion.outputs.minor }}
        --property:GitVersion_Patch=${{ steps.gitversion.outputs.patch }}
        --no-build
        --no-restore
        --nologo
        --filter "TestCategory=Unit|TestCategory=Simulate"
        --collect:"XPlat Code Coverage"
        --results-directory "${{ steps.calculate-version.outputs.TestResultsPath }}"

    # https://github.com/marketplace/actions/publish-test-results
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action/composite@v2.22.0
      id: test-results
      if: always()
      with:
        trx_files: ${{ steps.calculate-version.outputs.TestResultsPath }}/**/*.trx
        report_individual_runs: true

    # Package only after tests pass (gated flow)
    # https://devblogs.microsoft.com/dotnet/producing-packages-with-source-link/
    - name: Package projects
      working-directory: ./src
      run: >
        dotnet pack
        --configuration ${{ steps.calculate-version.outputs.BuildConfiguration }}
        --property:Version=${{ steps.calculate-version.outputs.FullSemVerLower }}
        --property:SolutionDir=${{ steps.calculate-version.outputs.BuildWorkspace }}/src/
        --property:GitVersion_AssemblySemFileVer=${{ steps.gitversion.outputs.assemblySemFileVer }}
        --property:GitVersion_InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
        --property:GitVersion_FullSemVer=${{ steps.gitversion.outputs.fullSemVer }}
        --property:GitVersion_Major=${{ steps.gitversion.outputs.major }}
        --property:GitVersion_Minor=${{ steps.gitversion.outputs.minor }}
        --property:GitVersion_Patch=${{ steps.gitversion.outputs.patch }}
        --no-build
        --no-restore
        --output "${{ steps.calculate-version.outputs.PackagesPath }}"

    # Upload packages as artifacts for 90 days (available for release workflow)
    - name: Upload Package Artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v6.0.0
      with:
        name: packages-${{ steps.calculate-version.outputs.FullSemVerLower }}
        path: ${{ steps.calculate-version.outputs.PackagesPath }}/*.nupkg
        retention-days: 90
        compression-level: 0

    # Tier 1: Create build tag on every successful build
    # Tags: vX.Y.Z (main branch) or vX.Y.Z-{branch-name}.{count} (dev/* branches)
    # Note: GitVersion already includes branch name in fullSemVer for non-main branches
    - name: Create build tag
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        VERSION="${{ steps.gitversion.outputs.fullSemVer }}"
        TAG="v${VERSION}"

        echo "Creating tag: ${TAG}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${TAG}" -m "Build from branch ${{ github.ref_name }}"
        git push origin "${TAG}"

