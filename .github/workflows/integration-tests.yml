name: Integration Tests

# Run daily at 4 PM UTC (after build, before scheduled release)
# Only on main branch to validate before release
on:
  schedule:
    - cron: '0 16 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

env:
  MSBUILDTERMINALLOGGER: off

jobs:
  integration-tests:
    runs-on: windows-latest
    # Note: Using windows-latest to support SQLCLR projects and SQL Server container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          persist-credentials: true

      # TODO: Set up Docker containers for external services
      # - SQL Server
      # - PostgreSQL
      # - MongoDB
      # - RabbitMQ
      # - Any other required services

      # TODO: Configure service health checks
      # Verify all services are ready before running tests

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0.x'

      - name: Use GitVersion
        uses: gittools/actions/gitversion/execute@v3.1.11
        id: gitversion
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      # TODO: Run integration tests
      # dotnet test src/ --filter "TestCategory=Integration"
      # Collect code coverage and test results

      # Tier 2: Create validated tag after successful integration tests
      # Tags: validated-vX.Y.Z (proof that code passed integration validation)
      - name: Create validated tag
        if: success() && github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.gitversion.outputs.fullSemVer }}"
          TAG="validated-v${VERSION}"

          echo "Creating validated tag: ${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Integration tests passed"
          git push origin "${TAG}"

      # TODO: Upload integration test results and coverage reports
      # - Test result artifacts
      # - Coverage reports (ReportGenerator)
      # - Docker logs (if available)

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Integration tests completed successfully"
          echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Validated Tag: validated-v${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Integration tests failed"
          echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Release will be blocked until tests pass"
