components:
  schemas:
    OoBDev.AI.Models.CompletionRequest:
      required:
        - prompt
      type: object
      properties:
        model:
          type: string
          nullable: true
        context:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
        images:
          type: array
          items:
            type: string
          nullable: true
        prompt:
          type: string
          nullable: true
        system:
          type: string
          nullable: true
        template:
          type: string
          nullable: true
      additionalProperties: false
    OoBDev.AI.Models.CompletionResponse:
      required:
        - context
        - response
      type: object
      properties:
        context:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
        response:
          type: string
          nullable: true
      additionalProperties: false
    OoBDev.Communications.Models.AttachmentReferenceModel:
      required:
        - containerName
        - documentKey
      type: object
      properties:
        containerName:
          type: string
          nullable: true
        documentKey:
          type: string
          nullable: true
      additionalProperties: false
    OoBDev.Communications.Models.EmailMessageModel:
      type: object
      properties:
        referenceId:
          type: string
          nullable: true
        fromAddress:
          type: string
          nullable: true
        toAddresses:
          type: array
          items:
            type: string
          nullable: true
        ccAddresses:
          type: array
          items:
            type: string
          nullable: true
        bccAddresses:
          type: array
          items:
            type: string
          nullable: true
        subject:
          type: string
          nullable: true
        textContent:
          type: string
          nullable: true
        htmlContent:
          type: string
          nullable: true
        headers:
          type: object
          additionalProperties:
            type: string
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/OoBDev.Communications.Models.AttachmentReferenceModel'
          nullable: true
      additionalProperties: false
    OoBDev.System.Text.Templating.FileType:
      required:
        - contentType
        - extension
      type: object
      properties:
        extension:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
