# Separate, throwaway stack for the desired-state database bake-off (docs/design/DesiredStateDatabase/bake-off-test-plan.md).
# It shares nothing with containers/testing: own project name, network, container names and host ports, and no volumes,
# so `down` leaves nothing behind. Every host port is overridable with BAKEOFF_PORT_<NAME>.
name: oobd-bakeoff

services:
  postgres:
    image: postgres:17.7
    container_name: oobd-bakeoff-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BAKEOFF_PASSWORD:-BakeOff123!}
    ports:
      - "${BAKEOFF_PORT_POSTGRES:-5440}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks: [bakeoff-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oobd-bakeoff-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${BAKEOFF_PASSWORD:-BakeOff123!}
    ports:
      - "${BAKEOFF_PORT_SQLSERVER:-1440}:1433"
    networks: [bakeoff-net]
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${BAKEOFF_PASSWORD:-BakeOff123!}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # A scratch Postgres for tools that plan on a second database (pgschema --plan-host, Atlas --dev-url).
  postgres-dev:
    image: postgres:17.7
    container_name: oobd-bakeoff-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BAKEOFF_PASSWORD:-BakeOff123!}
    ports:
      - "${BAKEOFF_PORT_POSTGRES_DEV:-5441}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks: [bakeoff-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # sqldef (sqlite3def, psqldef, mssqldef) and pgschema, built from pinned tags. Run with: docker exec oobd-bakeoff-tools <tool> ...
  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    image: oobd-bakeoff-tools:local
    container_name: oobd-bakeoff-tools
    working_dir: /work
    tmpfs:
      - /work
    networks: [bakeoff-net]
    depends_on:
      postgres: { condition: service_healthy }
      sql-server: { condition: service_healthy }

  # Atlas community edition (the free build; the earlier licence finding used the vendor binary). The image has no shell or sleep, so it
  # is not started with the stack: docker compose -f docker-compose.bakeoff.yml run --rm atlas schema diff ...
  atlas:
    image: arigaio/atlas:latest-community
    container_name: oobd-bakeoff-atlas
    profiles: [run]
    networks: [bakeoff-net]

networks:
  bakeoff-net:
    name: oobd-bakeoff-net
