events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Docker DNS resolver (allows nginx to start even if upstreams aren't ready)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name localhost;

        # Root dashboard page
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # ========================================
        # Web UI Services
        # ========================================

        # SMTP4Dev - Email testing interface
        location /smtp4dev/ {
            set $upstream_smtp4dev smtp4dev:80;
            proxy_pass http://$upstream_smtp4dev/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /smtp4dev;

            # Rewrite redirects to include /smtp4dev prefix
            proxy_redirect / /smtp4dev/;
        }

        # RabbitMQ Management Console
        location /rabbitmq/ {
            rewrite ^/rabbitmq$ /rabbitmq/ permanent;
            rewrite ^/rabbitmq/(.*)$ /$1 break;
            set $upstream_rabbitmq rabbitmq:15672;
            proxy_pass http://$upstream_rabbitmq;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            # Rewrite redirects to include /rabbitmq prefix
            proxy_redirect / /rabbitmq/;
            proxy_redirect ~^/(.*)$ /rabbitmq/$1;
        }

        # Keycloak Admin Console
        location /keycloak/ {
            set $upstream_keycloak keycloak:8080;
            rewrite ^/keycloak/(.*)$ /$1 break;
            proxy_pass http://$upstream_keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Rewrite redirects from Keycloak to include /keycloak prefix
            proxy_redirect http://$host/ http://$host/keycloak/;
            proxy_redirect https://$host/ https://$host/keycloak/;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Qdrant Dashboard
        location /qdrant/ {
            rewrite ^/qdrant$ /qdrant/ permanent;
            rewrite ^/qdrant/(.*)$ /$1 break;
            set $upstream_qdrant qdrant:6333;
            proxy_pass http://$upstream_qdrant;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite redirects to include /qdrant prefix
            proxy_redirect / /qdrant/;
            proxy_redirect ~^/(.*)$ /qdrant/$1;
        }

        # OpenSearch Dashboards
        location /opensearch-dashboards/ {
            set $upstream_opensearch_dashboards opensearch-dashboards:5601;
            proxy_pass http://$upstream_opensearch_dashboards/opensearch-dashboards/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Rewrite redirects to include /opensearch-dashboards prefix
            proxy_redirect / /opensearch-dashboards/;
            proxy_redirect ~^/(.*)$ /opensearch-dashboards/$1;
        }

        # ========================================
        # API Endpoints (for testing)
        # ========================================

        # Apache Tika API
        location /tika/ {
            set $upstream_tika apache-tika:9998;
            proxy_pass http://$upstream_tika/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OpenSearch API
        location /opensearch-api/ {
            rewrite ^/opensearch-api/(.*)$ /$1 break;
            set $upstream_opensearch opensearch:9200;
            proxy_pass https://$upstream_opensearch;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Qdrant API
        location /qdrant-api/ {
            rewrite ^/qdrant-api/(.*)$ /$1 break;
            set $upstream_qdrant_api qdrant:6333;
            proxy_pass http://$upstream_qdrant_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # LocalStack AWS API
        location /localstack/ {
            rewrite ^/localstack/(.*)$ /$1 break;
            set $upstream_localstack localstack:4566;
            proxy_pass http://$upstream_localstack;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SBert API
        location /sbert/ {
            set $upstream_sbert sbert:5000;
            proxy_pass http://$upstream_sbert/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
