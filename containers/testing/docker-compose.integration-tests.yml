# OoBDev Integration Test Stack
# Docker Compose configuration for running integration tests in CI/CD and locally
# This stack includes all Docker-based services needed for Integration test category
#
# Usage:
#   Local:  ./scripts/integration-up.sh
#   CI/CD:  docker compose -f docker-compose.integration-tests.yml up -d
#   Cleanup: docker compose -f docker-compose.integration-tests.yml down -v
#
# Note: Uses 'extends' to reuse existing service definitions from parent directory

name: oobd-integration-tests

services:
  # ============================================================================
  # Stateless Services - No persistent data between runs
  # ============================================================================

  apache-tika:
    extends:
      file: ../docker-compose.apache-tika.yml
      service: apache-tika
    container_name: oobd-test-tika
    ports: !override
      - "${TEST_PORT_TIKA:-9998}:9998"
    networks:
      - integration-test-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/9998' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smtp4dev:
    image: rnwood/smtp4dev
    container_name: oobd-test-smtp
    ports:
      - "${TEST_PORT_SMTP_WEB:-7777}:80"
      - "${TEST_PORT_SMTP:-25}:25"
      - "${TEST_PORT_IMAP:-143}:143"
    networks:
      - integration-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Stateful Services - Require cleanup between test runs
  # ============================================================================

  mongodb:
    extends:
      file: ../docker-compose.mongodb.yml
      service: mongodb
    container_name: oobd-test-mongodb
    ports: !override
      - "${TEST_PORT_MONGODB:-27017}:27017"
    networks:
      - integration-test-net
    volumes:
      - mongodb-test-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sql-server:
    extends:
      file: ../docker-compose.sql-server.yml
      service: sql-server
    container_name: oobd-test-sqlserver
    ports: !override
      - "${TEST_PORT_SQLSERVER:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-IntegrationTest123!}
      - MSSQL_PID=Developer
    networks:
      - integration-test-net
    volumes:
      - sqlserver-test-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD:-IntegrationTest123!}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:management
    container_name: oobd-test-rabbitmq
    ports:
      - "${TEST_PORT_RABBITMQ:-5673}:5672"   # AMQP (default avoids the Service Bus emulator on 5672)
      - "${TEST_PORT_RABBITMQ_MGMT:-15672}:15672" # Management UI
    networks:
      - integration-test-net
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-test-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: oobd-test-redis
    ports:
      - "${TEST_PORT_REDIS:-6379}:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    networks:
      - integration-test-net
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  opensearch:
    extends:
      file: ../docker-compose.opensearch.yml
      service: opensearch
    container_name: oobd-test-opensearch
    ports: !override
      - "${TEST_PORT_OPENSEARCH:-9200}:9200"
      - "${TEST_PORT_OPENSEARCH_PERF:-9600}:9600"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-IntegrationTest123!}
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=false
    networks:
      - integration-test-net
    volumes:
      - opensearch-test-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "-u", "admin:${OPENSEARCH_PASSWORD:-IntegrationTest123!}", "https://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    extends:
      file: ../docker-compose.qdrant.yml
      service: qdrant
    container_name: oobd-test-qdrant
    ports: !override
      - "${TEST_PORT_QDRANT:-6333}:6333"
      - "${TEST_PORT_QDRANT_GRPC:-6334}:6334"
    networks:
      - integration-test-net
    volumes:
      - qdrant-test-storage:/qdrant/storage
      - qdrant-test-snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Cloud Emulators - Azure and AWS service emulation
  # ============================================================================

  azurite:
    extends:
      file: ../docker-compose.azurite.yml
      service: azurite
    container_name: oobd-test-azurite
    ports: !override
      - "${TEST_PORT_AZURITE_BLOB:-10000}:10000"
      - "${TEST_PORT_AZURITE_QUEUE:-10001}:10001"
      - "${TEST_PORT_AZURITE_TABLE:-10002}:10002"
    networks:
      - integration-test-net
    volumes:
      - azurite-test-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(10000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Moto server: Apache-2.0 AWS emulator, no licence token. Host port 4566 is kept so SQS_ENDPOINT is unchanged.
  moto:
    image: motoserver/moto:latest
    container_name: oobd-test-moto
    ports:
      - "${TEST_PORT_MOTO:-4566}:5000"
    networks:
      - integration-test-net
    environment:
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: creates the SQS queues the integration tests expect, then exits
  moto-init:
    image: amazon/aws-cli:latest
    container_name: oobd-test-moto-init
    depends_on:
      moto:
        condition: service_healthy
    networks:
      - integration-test-net
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "/init/01-create-sqs-queues.sh"]
    volumes:
      - ./moto-init:/init:ro
    restart: "no"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: oobd-test-servicebus
    ports:
      - "${TEST_PORT_SERVICEBUS:-5672}:5672"   # AMQP
    networks:
      - integration-test-net
    environment:
      - ACCEPT_EULA=Y
      - SQL_SERVER=oobd-test-sqlserver
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-IntegrationTest123!}
    volumes:
      - ./servicebus-config/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      sql-server:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
    #     reservations:
    #       memory: 512M
    # Note: No health check - container has no shell/tools for checking
    # Service logs "Emulator Service is Successfully Up!" when ready
    # Tests should handle connection retries gracefully

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: oobd-test-otel
    ports:
      - "${TEST_PORT_GRAFANA:-3000}:3000"   # Grafana (also proxies the Tempo, Loki and Prometheus APIs)
      - "${TEST_PORT_OTLP_GRPC:-4317}:4317"   # OTLP gRPC
      - "${TEST_PORT_OTLP_HTTP:-4318}:4318"   # OTLP HTTP
    networks:
      - integration-test-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ============================================================================
  # Identity & Access Management
  # ============================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: oobd-test-keycloak
    ports:
      - "${TEST_PORT_KEYCLOAK:-8081}:8080"
    networks:
      - integration-test-net
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_PROXY=edge
      - KC_HOSTNAME_STRICT=false
    volumes:
      - keycloak-test-data:/opt/keycloak/data
      - ./keycloak-config/integration-test-realm.json:/opt/keycloak/data/import/integration-test-realm.json:ro
    command: start-dev --import-realm --features=scripts
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo 'OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ============================================================================
  # Reverse Proxy & Dashboard
  # ============================================================================

  nginx:
    image: nginx:alpine
    container_name: oobd-test-nginx
    ports:
      - "${TEST_PORT_NGINX:-8080}:80"
    networks:
      - integration-test-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - smtp4dev
      - rabbitmq
      - keycloak
      - qdrant
      - opensearch-dashboards
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Data Visualization
  # ============================================================================

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: oobd-test-opensearch-dashboards
    ports:
      - "${TEST_PORT_OPENSEARCH_DASHBOARDS:-5601}:5601"
    networks:
      - integration-test-net
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=false
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-IntegrationTest123!}
      - SERVER_BASEPATH=/opensearch-dashboards
      - SERVER_REWRITEBASEPATH=true
    depends_on:
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u \"$$OPENSEARCH_USERNAME:$$OPENSEARCH_PASSWORD\" http://localhost:5601/opensearch-dashboards/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # AI/ML Services - CPU-only for CI/CD compatibility
  # ============================================================================

  sbert:
    extends:
      file: ../docker-compose.sbert.yml
      service: sbert
    container_name: oobd-test-sbert
    ports: !override
      - "${TEST_PORT_SBERT:-5080}:5000"
    networks:
      - integration-test-net
    # Note: No GPU deployment for CI/CD compatibility
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/5000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    image: oobdev/ollama-phi3:latest
    container_name: oobd-test-ollama
    ports:
      - "${TEST_PORT_OLLAMA:-11435}:11434"
    networks:
      - integration-test-net
    volumes:
      - ollama-test-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ============================================================================
# Networks - Isolated test network
# ============================================================================

networks:
  integration-test-net:
    driver: bridge
    name: oobd-integration-test-net

# ============================================================================
# Volumes - Ephemeral volumes destroyed with 'down -v'
# ============================================================================

volumes:
  mongodb-test-data:
    name: oobd-test-mongodb-data
  sqlserver-test-data:
    name: oobd-test-sqlserver-data
  rabbitmq-test-data:
    name: oobd-test-rabbitmq-data
  redis-test-data:
    name: oobd-test-redis-data
  opensearch-test-data:
    name: oobd-test-opensearch-data
  qdrant-test-storage:
    name: oobd-test-qdrant-storage
  qdrant-test-snapshots:
    name: oobd-test-qdrant-snapshots
  azurite-test-data:
    name: oobd-test-azurite-data
  keycloak-test-data:
    name: oobd-test-keycloak-data
  ollama-test-data:
    name: oobd-test-ollama-data
