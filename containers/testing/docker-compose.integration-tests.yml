# OoBDev Integration Test Stack
# Docker Compose configuration for running integration tests in CI/CD and locally
# This stack includes all Docker-based services needed for Integration test category
#
# Usage:
#   Local:  ./scripts/integration-up.sh
#   CI/CD:  docker compose -f docker-compose.integration-tests.yml up -d
#   Cleanup: docker compose -f docker-compose.integration-tests.yml down -v
#
# Note: Uses 'extends' to reuse existing service definitions from parent directory

name: oobd-integration-tests

services:
  # ============================================================================
  # Stateless Services - No persistent data between runs
  # ============================================================================

  apache-tika:
    extends:
      file: ../docker-compose.apache-tika.yml
      service: apache-tika
    container_name: oobd-test-tika
    networks:
      - integration-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smtp4dev:
    image: rnwood/smtp4dev
    container_name: oobd-test-smtp
    ports:
      - "7777:80"
      - "25:25"
      - "143:143"
    networks:
      - integration-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Stateful Services - Require cleanup between test runs
  # ============================================================================

  mongodb:
    extends:
      file: ../docker-compose.mongodb.yml
      service: mongodb
    container_name: oobd-test-mongodb
    networks:
      - integration-test-net
    volumes:
      - mongodb-test-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sql-server:
    extends:
      file: ../docker-compose.sql-server.yml
      service: sql-server
    container_name: oobd-test-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-IntegrationTest123!}
      - MSSQL_PID=Developer
    networks:
      - integration-test-net
    volumes:
      - sqlserver-test-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD:-IntegrationTest123!}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:management
    container_name: oobd-test-rabbitmq
    ports:
      - "5673:5672"   # AMQP (changed to avoid conflict with Service Bus on 5672)
      - "15672:15672" # Management UI
    networks:
      - integration-test-net
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-test-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: oobd-test-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    networks:
      - integration-test-net
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  opensearch:
    extends:
      file: ../docker-compose.opensearch.yml
      service: opensearch
    container_name: oobd-test-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-IntegrationTest123!}
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=false
    networks:
      - integration-test-net
    volumes:
      - opensearch-test-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "-u", "admin:${OPENSEARCH_PASSWORD:-IntegrationTest123!}", "https://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    extends:
      file: ../docker-compose.qdrant.yml
      service: qdrant
    container_name: oobd-test-qdrant
    networks:
      - integration-test-net
    volumes:
      - qdrant-test-storage:/qdrant/storage
      - qdrant-test-snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Cloud Emulators - Azure and AWS service emulation
  # ============================================================================

  azurite:
    extends:
      file: ../docker-compose.azurite.yml
      service: azurite
    container_name: oobd-test-azurite
    networks:
      - integration-test-net
    volumes:
      - azurite-test-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  localstack:
    image: localstack/localstack:latest
    container_name: oobd-test-localstack
    ports:
      - "4566:4566"
    networks:
      - integration-test-net
    environment:
      - SERVICES=s3,sqs,sns,dynamodb,lambda,secretsmanager
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_HOST=localhost:4566
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: oobd-test-servicebus
    ports:
      - "5672:5672"   # AMQP
    networks:
      - integration-test-net
    environment:
      - ACCEPT_EULA=Y
      - SQL_SERVER=oobd-test-sqlserver
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-IntegrationTest123!}
    volumes:
      - ./servicebus-config/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      sql-server:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
    #     reservations:
    #       memory: 512M
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 1 bash -c '</dev/tcp/localhost/5672' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================================
  # Identity & Access Management
  # ============================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: oobd-test-keycloak
    ports:
      - "8081:8080"
    networks:
      - integration-test-net
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_PROXY=edge
      - KC_HOSTNAME_STRICT=false
    volumes:
      - keycloak-test-data:/opt/keycloak/data
      - ./keycloak-config/integration-test-realm.json:/opt/keycloak/data/import/integration-test-realm.json:ro
    command: start-dev --import-realm --features=scripts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ============================================================================
  # Reverse Proxy & Dashboard
  # ============================================================================

  nginx:
    image: nginx:alpine
    container_name: oobd-test-nginx
    ports:
      - "8080:80"
    networks:
      - integration-test-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - smtp4dev
      - rabbitmq
      - keycloak
      - qdrant
      - opensearch-dashboards
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Data Visualization
  # ============================================================================

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: oobd-test-opensearch-dashboards
    ports:
      - "5601:5601"
    networks:
      - integration-test-net
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=false
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-IntegrationTest123!}
      - SERVER_BASEPATH=/opensearch-dashboards
      - SERVER_REWRITEBASEPATH=true
    depends_on:
      - opensearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/opensearch-dashboards/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # AI/ML Services - CPU-only for CI/CD compatibility
  # ============================================================================

  sbert:
    extends:
      file: ../docker-compose.sbert.yml
      service: sbert
    container_name: oobd-test-sbert
    networks:
      - integration-test-net
    # Note: No GPU deployment for CI/CD compatibility
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: oobd-test-ollama
    ports:
      - "11434:11434"
    networks:
      - integration-test-net
    volumes:
      - ollama-test-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ============================================================================
# Networks - Isolated test network
# ============================================================================

networks:
  integration-test-net:
    driver: bridge
    name: oobd-integration-test-net

# ============================================================================
# Volumes - Ephemeral volumes destroyed with 'down -v'
# ============================================================================

volumes:
  mongodb-test-data:
    name: oobd-test-mongodb-data
  sqlserver-test-data:
    name: oobd-test-sqlserver-data
  rabbitmq-test-data:
    name: oobd-test-rabbitmq-data
  redis-test-data:
    name: oobd-test-redis-data
  opensearch-test-data:
    name: oobd-test-opensearch-data
  qdrant-test-storage:
    name: oobd-test-qdrant-storage
  qdrant-test-snapshots:
    name: oobd-test-qdrant-snapshots
  azurite-test-data:
    name: oobd-test-azurite-data
  keycloak-test-data:
    name: oobd-test-keycloak-data
  ollama-test-data:
    name: oobd-test-ollama-data
