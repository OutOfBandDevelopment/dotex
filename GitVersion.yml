# Versioning policy (GitVersion 6, Mainline strategy)
#   Major.Minor: from the last release tag (v0.5.0 today); change them by tagging the new base once
#   Patch: increments with every commit that reaches main (a merge adds its branch commits plus the merge commit), so it only goes up
#   Other branches: Major.Minor.Patch-{branch}.1+{commits in the branch}; main carries no label
mode: ContinuousDeployment

strategies:
  - Mainline
  - Fallback

branches:
  main:
    regex: ^main$
    increment: Patch
    label: ''

  feature:
    regex: ^(?!main$)(?<BranchName>.+)
    increment: Patch
    label: '{BranchName}'
    source-branches: ['main']

ignore:
  sha: []
