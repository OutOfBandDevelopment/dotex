# Versioning policy
#   Major: bumped by hand: a commit message containing "+semver: major" (or "next-version: 1.0.0" below)
#   Minor: bumped by every merge into main; the build tags main with vX.Y.0
#   Other branches: preview the next release (inherit main's Minor increment), so a branch cut after the merge of 0.5.0 builds
#          0.6.0-{branch}.N; the tag is the last release (vX.Y.0 on main, added by hand now that no workflow tags it)
mode: ContinuousDelivery

branches:
  main:
    regex: ^main$
    increment: Minor
    label: ''
    track-merge-target: false

  feature:
    regex: ^(?!main$)(?<BranchName>.+)
    increment: Inherit
    label: '{BranchName}'
    track-merge-target: false
    source-branches: ['main']

ignore:
  sha: []
